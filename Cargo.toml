[package]
name = "runcard"
version = "0.1.0"
edition = "2021"

[dependencies]
gpx = "0.10"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
resvg = "0.49"
usvg = "0.49"
tiny-skia = "0.12"
fontdb = "0.24"
skrifa = "0.44"
minijinja = "3"
serde = { version = "1", features = ["derive"] }
colorgrad = "0.9"
png = "0.18"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
