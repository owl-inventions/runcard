<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1000" viewBox="0 0 720 1000">
  <rect x="0" y="0" width="720" height="1000" fill="{{ theme.paper }}"/>

  <g fill="{{ theme.ink }}">
    <text x="32" y="52" font-family="IBM Plex Mono" font-weight="500" font-size="13" letter-spacing="3">{{ header }}</text>
    <text x="688" y="52" text-anchor="end" font-family="IBM Plex Mono" font-weight="500" font-size="13" letter-spacing="3">{{ date }}</text>

    <text x="32" y="130" font-family="Fraunces" font-size="{{ title_size }}">{{ title }}</text>
  </g>

{%- if mosaic %}
  <g>
{%- for tile in mosaic.tiles %}
    <rect x="{{ tile.x }}" y="{{ tile.y }}" width="{{ tile.size }}" height="{{ tile.size }}" rx="6" fill="{{ tile.color }}"{% if tile.partial %} stroke="{{ theme.ink }}" stroke-width="1.5" stroke-dasharray="3 3"{% endif %}/>
{%- endfor %}
  </g>
{%- if mosaic.fastest_ring %}
  <rect x="{{ mosaic.fastest_ring[0] }}" y="{{ mosaic.fastest_ring[1] }}" width="{{ mosaic.fastest_ring[2] }}" height="{{ mosaic.fastest_ring[2] }}" rx="6" fill="none" stroke="{{ theme.ink }}" stroke-width="2.5"/>
{%- endif %}
{%- for tile in mosaic.tiles %}
  <g fill="{{ theme.ink if tile.ink_text else theme.paper }}">
    <text x="{{ tile.km_x }}" y="{{ tile.km_y }}" font-family="IBM Plex Mono" font-weight="500" font-size="12" letter-spacing="1">{{ tile.index }}</text>
    <text x="{{ tile.cx }}" y="{{ tile.pace_y }}" text-anchor="middle" font-family="Bebas Neue" font-size="{{ mosaic.pace_size }}">{{ tile.pace }}</text>
{%- if tile.detail %}
    <text x="{{ tile.cx }}" y="{{ tile.detail_y }}" text-anchor="middle" font-family="IBM Plex Mono" font-weight="500" font-size="11">{{ tile.detail }}</text>
{%- endif %}
  </g>
{%- endfor %}
{%- endif %}

  <text x="32" y="740" font-family="Bebas Neue" font-size="{{ runner_size }}" fill="{{ theme.ink }}">{{ runner | upper }}</text>
{%- if mosaic %}
  <path d="{{ mosaic.route_path }}" fill="none" stroke="{{ theme.ink }}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="{{ mosaic.route_start[0] }}" cy="{{ mosaic.route_start[1] }}" r="4" fill="{{ theme.accent }}"/>
{%- endif %}

  <g fill="{{ theme.ink }}" font-family="IBM Plex Mono" font-weight="500" font-size="12" letter-spacing="3">
    <text x="32" y="790">SLOW</text>
{%- for color in legend %}
    <rect x="{{ 104 + loop.index0 * 24 }}" y="779" width="22" height="14" fill="{{ color }}"/>
{%- endfor %}
    <text x="{{ 104 + (legend | length) * 24 + 30 }}" y="790">FAST</text>
  </g>

{%- if fastest_line %}
  <text x="32" y="830" fill="{{ theme.ink }}" font-family="IBM Plex Mono" font-weight="500" font-size="13" letter-spacing="3">{{ fastest_line }}</text>
{%- endif %}

  <line x1="32" y1="860" x2="688" y2="860" stroke="{{ theme.ink }}" stroke-opacity="0.25" stroke-width="1"/>

  <g fill="{{ theme.ink }}" font-family="IBM Plex Mono" font-weight="500" font-size="12" letter-spacing="3">
    <text x="32" y="900">DISTANCE</text>
    <text x="272" y="900">TIME</text>
    <text x="512" y="900">PACE</text>
  </g>
  <g fill="{{ theme.ink }}" font-family="Bebas Neue" font-size="44">
    <text x="32" y="948">{{ distance }}</text>
    <text x="272" y="948">{{ time }}</text>
    <text x="512" y="948">{{ pace }}</text>
  </g>
</svg>
