<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1000" viewBox="0 0 720 1000">
  <rect x="0" y="0" width="720" height="1000" fill="#f4efe6"/>

  <g fill="#1b1b1b">
    <text x="32" y="52" font-family="IBM Plex Mono" font-weight="500" font-size="13" letter-spacing="3">{{ header }}</text>
    <text x="688" y="52" text-anchor="end" font-family="IBM Plex Mono" font-weight="500" font-size="13" letter-spacing="3">{{ date }}</text>

    <text x="32" y="130" font-family="Fraunces" font-size="{{ title_size }}">{{ title }}</text>
  </g>

  <g>
{%- set ns = namespace(x=32) %}
{%- for stripe in stripes %}
    <rect x="{{ ns.x | round(2) }}" y="180" width="{{ stripe.width }}" height="380" fill="{{ stripe.color }}"/>
{%- set ns.x = ns.x + stripe.width + 2 %}
{%- endfor %}
  </g>
{%- if fastest_x is not none %}
  <circle cx="{{ fastest_x }}" cy="166" r="4" fill="#1b1b1b"/>
{%- endif %}

  <g fill="#1b1b1b" font-family="IBM Plex Mono" font-weight="500" font-size="12">
{%- if ticks %}
    <text x="32" y="592" letter-spacing="2">KM</text>
{%- endif %}
{%- for tick in ticks %}
    <text x="{{ tick[0] }}" y="592" text-anchor="middle">{{ tick[1] }}</text>
{%- endfor %}
  </g>

  <text x="32" y="700" font-family="Bebas Neue" font-size="{{ runner_size }}" fill="#1b1b1b">{{ runner | upper }}</text>
  <path d="{{ route_path }}" fill="none" stroke="#1b1b1b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="{{ route_start[0] }}" cy="{{ route_start[1] }}" r="4" fill="#e8601c"/>

  <g fill="#1b1b1b" font-family="IBM Plex Mono" font-weight="500" font-size="12" letter-spacing="3">
    <text x="32" y="760">SLOW</text>
{%- for color in legend %}
    <rect x="{{ 104 + loop.index0 * 24 }}" y="749" width="22" height="14" fill="{{ color }}"/>
{%- endfor %}
    <text x="{{ 104 + (legend | length) * 24 + 30 }}" y="760">FAST</text>
  </g>

{%- if fastest_line %}
  <text x="32" y="812" fill="#1b1b1b" font-family="IBM Plex Mono" font-weight="500" font-size="13" letter-spacing="3">{{ fastest_line }}</text>
{%- endif %}

  <line x1="32" y1="860" x2="688" y2="860" stroke="#1b1b1b" stroke-opacity="0.25" stroke-width="1"/>

  <g fill="#1b1b1b" font-family="IBM Plex Mono" font-weight="500" font-size="12" letter-spacing="3">
    <text x="32" y="900">DISTANCE</text>
    <text x="272" y="900">TIME</text>
    <text x="512" y="900">PACE</text>
  </g>
  <g fill="#1b1b1b" font-family="Bebas Neue" font-size="44">
    <text x="32" y="948">{{ distance }}</text>
    <text x="272" y="948">{{ time }}</text>
    <text x="512" y="948">{{ pace }}</text>
  </g>
</svg>
